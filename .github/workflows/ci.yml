name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests-et-paquet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    steps:
      - name: Récupérer le dépôt et son historique complet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Installer le paquet, l'interface et les outils de test
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[ui]" -r requirements-dev.txt "pytest==8.3.*"
          .venv/bin/python -m pip check

      - name: Vérifier l'environnement et les fiches de cadrage
        run: .venv/bin/python scripts/check_setup.py

      - name: Générer les données et entraîner le modèle de démonstration
        run: |
          .venv/bin/python src/make_demo.py
          .venv/bin/python src/train.py

      - name: Vérifier les compléments explicabilité et biais
        run: |
          .venv/bin/python src/expliquer.py
          .venv/bin/python src/biais.py

      - name: Contrôler le code adapté au TP6 avec Ruff
        run: |
          .venv/bin/ruff check api/model.py sentiment_app src/predict.py tests/test_packaging.py tests/test_client.py src/expliquer.py src/biais.py ui/graphiques.py tests/test_explicabilite.py tests/test_biais.py tests/test_graphiques.py tests/test_fiche_modele.py

      - name: Vérifier les types de l'API
        run: .venv/bin/mypy api

      - name: Exécuter tous les tests et mesurer la couverture de l'API
        run: |
          .venv/bin/python -m pytest -q --cov=api --cov-report=term-missing --cov-report=xml --cov-fail-under=95

      - name: Vérifier la commande installée
        run: |
          .venv/bin/sentiment --version
          .venv/bin/sentiment predict "Livraison rapide, produit conforme, très satisfait"

      - name: Construire la distribution source et la roue
        run: .venv/bin/python -m build

      - name: Vérifier le contenu des distributions
        run: |
          .venv/bin/python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sources = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sources) == 1, "Une roue et une archive source attendues"
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              for package in ("api", "sentiment_app", "ui"):
                  assert any(name.startswith(package + "/") for name in names), package
              assert not any(name.startswith(("tests/", "data/", "models/", "src/")) for name in names)
              assert not any(name.endswith(".joblib") for name in names)
          with tarfile.open(sources[0]) as archive:
              assert not any(name.endswith(".joblib") for name in archive.getnames())
          print("Distribution source et roue conformes")
          PY

      - name: Installer et essayer la roue dans un environnement neuf hors du dépôt
        run: |
          roue_venv="$RUNNER_TEMP/sentiment-roue"
          roue_work="$RUNNER_TEMP/sentiment-essai"
          python -m venv "$roue_venv"
          "$roue_venv/bin/python" -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          "$roue_venv/bin/python" -m pip check
          mkdir -p "$roue_work"
          cd "$roue_work"
          unset SENTIMENT_MODELE
          unset PYTHONPATH
          "$roue_venv/bin/python" - <<'PY'
          import subprocess
          import sys

          command = [sys.executable, "-m", "sentiment_app", "predict", "Livraison rapide"]
          result = subprocess.run(command, capture_output=True, text=True)
          assert result.returncode == 1, (result.returncode, result.stdout, result.stderr)
          assert "sentiment.joblib" in result.stderr, result.stderr
          assert any(word in result.stderr.lower() for word in ("absent", "introuvable")), result.stderr
          print("Absence de modèle : erreur explicite et code de sortie 1")
          PY
          export SENTIMENT_MODELE="$GITHUB_WORKSPACE/models/sentiment.joblib"
          "$roue_venv/bin/python" - <<'PY'
          import json
          import subprocess
          import sys

          command = [sys.executable, "-m", "sentiment_app", "predict",
                     "Livraison rapide, produit conforme, très satisfait"]
          result = subprocess.run(command, capture_output=True, text=True, check=True)
          prediction = json.loads(result.stdout)
          assert prediction["label"] == "POSITIVE", prediction
          assert 0.60 <= prediction["score"] <= 1.0, prediction
          print(result.stdout.strip())
          PY
          "$roue_venv/bin/sentiment" --version

      - name: Conserver les distributions
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-app-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: couverture-api
          path: coverage.xml
          if-no-files-found: ignore
